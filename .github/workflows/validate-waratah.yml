name: Validate WARATAH
on:
  pull_request:
    branches: [uat]
  push:
    branches: [uat, 'codex/waratah-deployment']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    name: WARATAH validation
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check POD review rules and lifecycle
        shell: powershell
        run: ./tools/Test-Pord.ps1
      - name: Check NORM calculation, presentation and Defence workflows
        shell: powershell
        run: |
          ./tools/tests/EmployeeBenefits/Run.ps1
          ./tools/tests/Increment1B2/Run.ps1 -SamplePath './docs/Trial Balance Examples/Defence TB - ERP Format FY26.xlsx'
      - name: Check FR-016 source validation and statement engine
        shell: powershell
        run: ./tools/tests/FR016/Run.ps1
      - name: Compile and package tracked application files
        shell: powershell
        run: ./tools/deploy/New-WaratahPackage.ps1 -Commit $env:GITHUB_SHA -OutputDirectory "$env:RUNNER_TEMP/waratah-validation" -Compile
      - name: Verify NIHRACS seed isolation and comparative persistence on LocalDB
        if: ${{ hashFiles('sql/NORM_Stage2B_NIHRACS_Hierarchy.sql') != '' }}
        shell: powershell
        run: ./tools/tests/EmployeeBenefits/Test-NihracsSeed.ps1
      - name: Verify narrative migration, persistence and browser preparation
        shell: pwsh
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP 'norm-narrative-validation'
          New-Item -ItemType Directory -Path $evidence | Out-Null
          ./tools/tests/NarrativeBlocks/Run.ps1 -EvidenceDirectory $evidence
          node --experimental-websocket ./tools/tests/NarrativeBlocks/Browser.cjs (Join-Path $evidence 'narratives.json') $evidence 'validation'
          if ($LASTEXITCODE -ne 0) { throw 'Narrative browser fixture failed.' }
      - name: Exercise deployment and rollback in isolation
        shell: powershell
        run: ./tools/deploy/Test-DeploymentSafety.ps1 -PackageInfo "$env:RUNNER_TEMP/waratah-validation/package.json"
      - name: Verify AWS request encoding and account checks
        shell: powershell
        run: ./tools/deploy/Test-DeploymentRequest.ps1
